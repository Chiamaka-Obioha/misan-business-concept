<style>
/* Layout: one phone-sized app, full screen on phones, centred in a frame on wider screens. Single committed light look. */
:root {
  --ink: #1C0045;
  --lime: #D9FF1F;
  --violet: #7A00E6;
  --violet-deep: #5A00AA;
  --lilac: #F0E6FF;

  --mist: #F5F5F7;
  --line: #EFEFF2;
  --text: #1C1C1E;

  --ok-bg: #E7F4E2;
  --warn: #8A4B0B;
  --warn-bg: #FFF3DD;
  --stage: #E9E4F2;
  --display: 'Archivo Black', 'Arial Black', 'Helvetica Neue', sans-serif;
  --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;

}
html, body { height: 100%; }
body { background: var(--stage); color: var(--text); font-family: var(--body); font-size: 14px; }
.stage { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }

.caption { font-size: 12px; color: var(--muted); text-align: center; padding-inline: 16px; }
@media (min-width: 600px) and (min-height: 760px) {
  .stage { padding-block: 24px; box-sizing: border-box; }
  .phone { height: calc(100% - 40px); border-radius: 36px; box-shadow: 0 30px 60px -20px rgba(28,0,69,.35), 0 0 0 10px var(--ink); }
}
@media (max-width: 599px), (max-height: 759px) { .caption { display: none; } }
.banner { flex-shrink: 0; background: var(--ink); color: var(--lime); font-size: 11px; font-weight: 600; text-align: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { flex: 1; overflow-y: auto; padding-block: 18px 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
button { font-family: inherit; cursor: pointer; color: inherit; }
button:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }
h1 { margin: 6px 0 0; font-family: var(--display); font-weight: 400; font-size: 32px; line-height: 1.02; color: var(--ink); text-wrap: balance; }
.lede { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
.small { font-size: 12px; color: var(--muted); }
.tiny { font-size: 11px; line-height: 1.5; color: var(--muted); margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.back { width: 44px; height: 44px; margin: -8px 0 -6px -10px; border: none; background: none; display: flex; align-items: center; justify-content: center; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .02em; }
.avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--ink); color: var(--lime); display: grid; place-items: center; font-size: 12px; font-weight: 700; }

.center { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-bottom: 6px; }
.center .big { color: var(--ink); }
.steps { background: var(--mist); border-radius: 18px; padding: 18px; }

.step { display: flex; gap: 12px; }
.rail { display: flex; flex-direction: column; align-items: center; width: 16px; flex-shrink: 0; }

.earncard { background: var(--violet); color: #fff; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 6px; }

.opt { border: 2px solid #E2E2E8; border-radius: 16px; background: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%; }
.opt[aria-pressed="true"] { border-color: var(--violet); }
.opt .grow { display: flex; flex-direction: column; gap: 2px; }

.field { display: flex; flex-direction: column; gap: 6px; }

.field input, .field select { height: 48px; border: 1.5px solid #E2E2E8; border-radius: 12px; padding: 0 14px; background: #fff; font-family: inherit; font-size: 16px; }

.tabs { flex-shrink: 0; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 8px max(4px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px)); }
.tabs button { min-height: 52px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #9A9AA5; font-size: 11px; font-weight: 600; }

.kybm { border-radius: 16px; padding: 14px 16px; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; }

.chip-btn { flex: 0 0 auto !important; min-height: 38px; border: none; border-radius: 10px; padding: 0 14px; background: var(--ink); color: var(--lime); font-weight: 600; font-size: 13px; }

.ob.web { min-height: calc(100vh - 32px); background: var(--ground); }
.ob-wrap { max-width: 600px; margin: 0 auto; padding-block: 22px 44px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; box-sizing: border-box; }

.ob h2 { margin: 6px 0 0; font-size: 15px; font-weight: 700; }

.ob-btn { min-height: 52px; border: none; border-radius: 14px; background: var(--ink); color: var(--lime); font-weight: 600; font-size: 15px; width: 100%; font-family: inherit; cursor: pointer; }

.ob-row { display: flex; gap: 10px; flex-wrap: wrap; }

.ob-link { border: none; background: none; color: var(--violet); font-weight: 600; font-family: inherit; font-size: 14px; padding: 6px 0; cursor: pointer; align-self: flex-start; }
.ob-back { width: 44px; height: 44px; margin: -6px 0 -6px -10px; border: none; background: none; display: grid; place-items: center; cursor: pointer; }

<body>

<div class="stage">
  <p class="caption">Clickable concept by Chiamaka Obioha for Misan Business. Not an official Misan product; all figures are samples.</p>
  <div class="phone">
    <div class="banner">Concept by Chiamaka Obioha · not an official Misan product</div>
    <div class="ob" id="ob" hidden></div>
    <main class="screen" id="screen" aria-live="polite"></main>
    <div class="toast" id="toast" role="status" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </div>
</div>

<script>

/* Onboarding module. Renders into #ob.
   Host provides window.obHostShow(showApp) and window.obKyb(status) where status is 'none' | 'submitted'. */
(function () {
  const el = document.getElementById('ob');
  const O = { view: 'welcome', path: 'new', kyb: 'none', step: 0, entity: 'ltd', rc: '1234567', looked: false, industry: 'Import and export', selfie: false,
    acct: { first: 'Kola', last: 'Ogun', email: 'kola@kolaexports.example', phone: '+234 803 000 1122', biz: 'Kola Exports Ltd' },
    invited: {}, signers: { kola: true, tunde: true }, pep: 'no', nominee: 'no', docs: {}, consent: false, consent2: false, err: '', note: '' };
  const ent = {
    ltd: { label: 'Limited company', sub: 'Ltd, registered with CAC (RC number)', num: 'RC number' },
    bn: { label: 'Business name', sub: 'Sole owner or partnership (BN number)', num: 'BN number' },
    it: { label: 'Incorporated trustees', sub: 'NGO, church, association (IT number)', num: 'IT number' }
  };

  function render() { el.innerHTML = `<div class="ob-wrap"><div class="ob-card">${V[O.view]()}</div></div>`; el.scrollTop = 0; window.scrollTo(0, 0); }
  function to(v) { O.view = v; O.err = ''; O.note = ''; render(); }
  function enterApp() { window.obKyb(O.kyb); window.obHostShow(true); }
  function validate() {
    if (O.step === 0 && O.path === 'switch' && !O.consent2) return 'Tick the box to let us reuse your personal verification.';
    if (O.step === 0 && O.path === 'new' && !O.selfie) return 'Take your selfie to continue.';
    if (O.step === 1 && !O.looked) return 'Find your business on CAC first.';
    if (O.step === 2 && !Object.values(O.signers).some(Boolean)) return 'Choose at least one person who can approve payments.';
    if (O.step === 3) { const miss = docList().filter((d) => d[2] !== 'cac' && !O.docs[d[0]]); if (miss.length) return 'Upload ' + miss.length + ' more document' + (miss.length > 1 ? 's' : '') + ' to continue.'; }
    if (O.step === 4 && !O.consent) return 'Tick the box to confirm your details.';
    return '';
  }
  const act = {
    to: (v) => to(v),

    signupDone: () => { if (val('ob-otp').replace(/\D/g, '').length !== 6) { O.err = 'The code has 6 digits. Check the text message and try again.'; render(); return; } O.kyb = 'none'; enterApp(); },

        <button class="promo" data-a="go" data-v="earn">
          <b>YOUR IDLE CASH IS <em>EARNING</em></b>
          <span>Anything above your floor moves into Earn every evening. Get it back next business day for free.</span>
          <i>See Earn →</i>
        </button>
        <div class="sect"><h2>Recent activity</h2><span class="link">See all</span></div>
        <div class="list">${rows}</div>`;
    },
    collect() {
      const rows = accounts.map((a) => `
        <button class="row" data-a="detail" data-v="${a.code}">
          <span class="code">${a.code}</span>
          <span class="grow"><span class="t">${a.name}</span><span class="small">${a.country} · ${a.rails}</span></span>
          <span class="pill ${isOn(a) ? 'ok' : 'new'}">${isOn(a) ? 'Active' : 'Coming soon'}</span>
        </button>`).join('');
      return `<h1>COLLECT</h1>
        <p class="lede">Local account details in your business name. Customers pay you with a normal local transfer.</p>
        <div class="list">${rows}</div>
        <button class="secondary" data-a="go" data-v="customers">Customer accounts</button>`;
    },
    detail() {
      const d = accounts.find((a) => a.code === S.cur);
      if (!isOn(d)) return `${back()}<h1>OPEN A ${d.code} ACCOUNT</h1>
        <p class="lede">Get ${d.country} account details in your business name, paid by ${d.rails}. We use the business documents you already gave us, so there's nothing new to upload.</p>
        <button class="primary" data-a="activate">Open ${d.code} account</button>`;
      const lines = d.lines.map((l) => `<div class="kv"><span class="k">${l[0]}</span><span class="v num">${l[1]}<button class="copy" data-a="copy" data-v="${l[0]}" aria-label="Copy ${l[0]}">${ic.copy}</button></span></div>`).join('');
      return `${back()}<h1>${d.code} ACCOUNT DETAILS</h1>
        <p class="lede">Your customers pay into this account by ${d.rails}.</p>
        <div class="list"><div class="kv"><span class="k">Account name</span><span class="v">KOLA EXPORTS LTD</span></div>${lines}</div>
        <p class="tiny">Sample details for illustration</p>
        <div class="setting"><span class="grow"><span class="t">Auto-convert to NGN</span><span class="small">Convert 50% of each ${d.code} payment when it lands</span></span>${toggle('convert', 'Auto-convert to NGN', !!S.convert[d.code])}</div>
        <button class="primary" data-a="share">Share account details</button>`;
    },
    track() {
      const p = payData(S.pay);
      const steps = p.steps.map((s) => `<div class="step"><span class="rail"><span class="dot d-${s[2]}"></span><span class="line"></span></span><span class="grow"><span class="t" style="font-weight:600${s[2] === 'hold' ? ';color:var(--warn)' : s[2] === 'todo' ? ';color:var(--muted)' : ''}">${s[0]}</span><span class="small">${s[1]}</span></span></div>`).join('');
      return `${back()}<div class="center"><span style="font-weight:700;color:var(--ink)">Payment details</span><span class="big num">+${p.amount}</span><span class="small">From ${p.from}</span><span style="font-weight:700;color:${toneColor[p.tone]}">${p.status}</span></div>
        <div class="steps"><p>Where your money is</p>${steps}</div>
        ${p.action ? `<div class="hold"><p><b>We need one thing from you</b></p><p>Upload the invoice for this payment and we'll release it. Most holds clear within 2 hours of upload.</p><button class="primary" data-a="upload">Upload invoice</button></div>` : ''}
        <p class="tiny">Paid into ${p.into}. You'll get a push notification, an email and a webhook at each step.</p>`;
    },
    pay() {
      const seg = `<div class="seg" role="group" aria-label="Payment type"><button data-a="payMode" data-v="single" aria-pressed="${S.payMode === 'single'}">Send money</button><button data-a="payMode" data-v="bulk" aria-pressed="${S.payMode === 'bulk'}">Bulk payouts</button></div>`;
      if (S.payMode === 'single') return `<h1>PAY</h1>${seg}` + sendForm('', '');
      return `<h1>PAY</h1>${seg}` + views.payBulk().split('<!--BULK-->')[1];
    },
    payBulk() {
      const st = { draft: ['Draft', 'grey'], pending: ['Awaiting approval', 'warn'], sent: ['Sent', 'ok'] }[S.run];
      const payees = [['Kwame Mensah', 'Ghana · MTN Mobile Money', 'GHS 4,500'], ['Wanjiru Kamau', 'Kenya · M-Pesa', 'KES 62,000'], ['Adeyemi Packaging Ltd', 'Nigeria · bank transfer', '₦1,250,000'], ['Thames Freight Ltd', 'United Kingdom · Faster Payments', '£1,800']]
        .map((y) => `<div class="r"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="t" style="font-weight:600">${y[0]}</span><span class="small">${y[1]}</span></span><span class="num" style="font-weight:700;flex-shrink:0">${y[2]}</span></div>`).join('');
      const cta = S.run === 'draft' ? `<button class="primary" data-a="submit">Submit for approval</button>`
        : S.run === 'pending' ? `<p class="lede" style="font-size:13px">Runs over ₦5,000,000 need a second approver. Tunde (Finance) has been notified.</p><button class="primary" data-a="approve">Approve as Tunde (demo)</button>`
        : `<button class="secondary" data-a="resetRun">Start a new run</button>`;
      return `<h1>PAY</h1>
        <p class="lede">Pay suppliers, staff and contractors in bulk, to bank and mobile money accounts in 15+ countries.</p>
<!--BULK-->        <div class="batch"><div class="head"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">October supplier run</span><span class="small">suppliers-oct.csv · 12 payees · 4 countries</span></span><span class="pill ${st[1]}">${st[0]}</span></div>${payees}
        <div class="r"><span class="small">+ 8 more payees · rates locked for 30 minutes once approved</span></div></div>
        ${cta}
        <div class="sect" style="padding-top:6px"><h2>Scheduled runs</h2></div>
        <div class="list">
          <div class="row"><span class="grow"><span class="t">Staff payroll</span><span class="small">25th of every month · Earn gives notice on the 24th</span></span><span class="end num">₦8,400,000</span></div>
          <div class="row"><span class="grow"><span class="t">UK contractors</span><span class="small">Every other Friday</span></span><span class="end num">£3,200</span></div>
        </div>`;
    },
    earn() {
      const n = S.earnCur === 'NGN';
      const e = n ? { bal: '₦12,450,000', gain: '+₦186,400', prod: 'naira Treasury Bills', floor: '₦2,000,000', amt: '₦1,000,000', notice: '₦8,400,000' }
                  : { bal: '$15,200.00', gain: '+$118.40', prod: 'dollar fixed income', floor: '$3,000', amt: '$1,000', notice: '$0.00' };
      return `<h1>EARN</h1>
        <div class="seg" role="group" aria-label="Currency"><button data-a="earnCur" data-v="NGN" aria-pressed="${n}">Naira</button><button data-a="earnCur" data-v="USD" aria-pressed="${!n}">Dollar</button></div>
        <section class="earncard"><span class="sub">Earn balance</span><span class="big num">${e.bal}</span><span class="gain num">${e.gain} earned this month</span><span class="sub">Invested in ${e.prod} · rate is variable and shown daily</span></section>
        <div class="setting"><span class="grow"><span class="t">Evening sweep</span><span class="small">Keep ${e.floor} in the wallet, move the rest into Earn</span></span>${toggle('sweep', 'Evening sweep', S.sweep)}</div>
        <div class="sect"><h2>Withdraw ${e.amt}</h2></div>
        <button class="opt" data-a="wd" data-v="notice" aria-pressed="${S.wd === 'notice'}"><span class="grow"><span class="t">Next business day</span><span class="small">Back in your wallet on Wed 28 Oct</span></span><span class="free">Free</span></button>
        <button class="opt" data-a="wd" data-v="instant" aria-pressed="${S.wd === 'instant'}"><span class="grow"><span class="t">Instant</span><span class="small">Back in your wallet now</span></span><span class="fee">2% fee</span></button>
        <button class="primary" data-a="withdraw" data-v="${e.amt}">Withdraw</button>
        <div class="row" style="border-top:1px solid var(--line)"><span class="grow"><span class="t">On notice for payroll</span><span class="small">Back on 24 Nov, before the 25 Nov run</span></span><span class="end num">${e.notice}</span></div>
        <p class="tiny">Returns are variable and not guaranteed. Investments would be provided through Bamboo's licensed entities. All figures are samples.</p>`;
    },
    more() {
      const items = [
        ['team', 'Team and approvals', 'Roles, limits, two-person approval', '3 people', 'var(--muted)'],
        ['cards', 'Staff cards', 'Virtual USD cards with monthly limits', '3 cards', 'var(--muted)'],
        ['customers', 'Customer accounts', 'One account per customer, auto-matched', '3 active', 'var(--muted)'],
        ['xero', 'Xero', 'Sync every transaction to your books', S.xero ? 'Connected' : 'Connect', S.xero ? 'var(--ok)' : 'var(--violet)'],
        ['statement', 'Statements', 'CSV and PDF, any currency, any month', 'Download', 'var(--violet)'],
        ['dev', 'Developers', 'API keys, endpoints, webhooks', 'Test mode', 'var(--muted)'],
        ['logout', 'Log out', 'Sign out of Kola Exports Ltd', '', 'var(--muted)']
      ].map((m) => `<button class="row" data-a="more" data-v="${m[0]}"><span class="grow"><span class="t" style="font-size:15px">${m[1]}</span><span class="small">${m[2]}</span></span><span style="flex-shrink:0;font-size:13px;font-weight:600;color:${m[4]}">${m[3]}</span></button>`).join('');
      return `<h1>MORE</h1><div class="list">${items}</div>`;
    },
    team() {
      const people = [['KO', 'Kola Ogun', 'Owner · can approve', 'No limit'], ['TA', 'Tunde Ade', 'Finance · can approve', '₦20,000,000 a day'], ['AE', 'Amaka Eze', 'Operations · can prepare', 'Prepares only']]
        .map((p) => `<div class="row"><span class="code" style="font-size:13px">${p[0]}</span><span class="grow"><span class="t">${p[1]}</span><span class="small">${p[2]}</span></span><span class="small num" style="text-align:right">${p[3]}</span></div>`).join('');
      return `${back()}<h1>TEAM AND APPROVALS</h1>
        <div class="setting"><span class="grow"><span class="t">Two approvers above ₦5,000,000</span><span class="small">One person prepares, another approves</span></span>${toggle('rule', 'Two approvers above five million naira', S.rule)}</div>
        <div class="list">${people}</div>`;
    },
    cards() {
      const cards = [['Marketing · Amaka', '4417', '$640', '$1,500', 'ads', 43], ['Software · Tunde', '9025', '$310', '$500', 'subscriptions', 62], ['Travel · Kola', '1182', '$0', '$3,000', 'flights and hotels', 0]]
        .map((c) => `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:700">${c[0]}</span><span class="small num">•••• ${c[1]}</span></div><span class="small num">${c[2]} of ${c[3]} this month · ${c[4]}</span><div class="bar"><span style="width:${c[5]}%"></span></div></div>`).join('');
      return `${back()}<h1>STAFF CARDS</h1><p class="lede">Virtual USD cards for ads, software and travel, each with its own monthly limit.</p>${cards}`;
    },
    customers() {
      const rows = [['BF', 'Brightway Foods Ltd', 'GBP account ending 4471', '£12,600.00'], ['AT', 'Atlantic Textiles Inc', 'USD account ending 2290', '$5,900.00'], ['LF', 'Lekki Fresh Market', 'NGN account ending 8813', '₦5,400,000']]
        .map((c) => `<div class="row"><span class="code" style="font-size:13px">${c[0]}</span><span class="grow"><span class="t">${c[1]}</span><span class="small">${c[2]}</span></span><span class="end num">${c[3]}<span class="small" style="font-weight:400">this month</span></span></div>`).join('');
      return `${back()}<h1>CUSTOMER ACCOUNTS</h1>
        <p class="lede">Give each customer their own account details. Every payment matches to the right customer, with no reference needed.</p>
        <div class="setting"><span class="grow"><span class="t">Auto-match payments</span><span class="small">${S.match ? '100% of payments matched this month' : 'Off: payments need a reference to match'}</span></span>${toggle('match', 'Auto-match payments', S.match)}</div>
        <div class="list">${rows}</div>
        <button class="primary" data-a="addCustomer">Add customer account</button>`;
    },
    dev() {
      const events = ['collection.credited', 'collection.on_hold', 'payout.completed', 'payout.failed', 'earn.withdrawal.settled'];
      const masked = S.key.slice(0, 8) + '••••••••' + S.key.slice(-4);
      const keyBlock = S.regen
        ? `<div class="hold"><p><b>Regenerate the test key?</b></p><p>The current key stops working immediately. Apps using it will fail until you update them.</p><button class="primary" data-a="regenConfirm">Regenerate now</button><button class="secondary" data-a="regenCancel">Cancel</button></div>`
        : S.keyShown
          ? `<div class="card"><span class="small" style="font-weight:600">New test key. Copy it now; we won't show it again.</span><div class="keybox">${S.key}</div><button class="primary" data-a="keySaved">I've saved it</button></div>`
          : `<div class="card"><span class="small" style="font-weight:600">Test API key</span><span style="font-family:var(--mono);font-size:13px">${masked}</span></div><button class="secondary" data-a="regen">Regenerate key</button>`;
      const ips = S.ips.map((ip, i) => `<div class="row" style="min-height:56px"><span class="grow"><span class="t" style="font-family:var(--mono);font-size:13px">${ip[0]}</span><span class="small">${ip[1]}</span></span><button class="copy" style="width:auto;padding:0 8px;color:var(--violet);font-weight:600" data-a="ipRemove" data-v="${i}" aria-label="Remove ${ip[0]}">Remove</button></div>`).join('');
      return `${back()}<h1>DEVELOPERS</h1><p class="lede">Collect, pay and track from your own systems.</p>
        ${keyBlock}
        <div class="sect"><h2>IP allowlist</h2></div>
        <div class="list">${ips}</div>
        <div class="field"><label for="ipnew">Add an IP address or range</label><input id="ipnew" placeholder="e.g. 102.89.34.18" style="font-family:var(--mono)"></div>
        ${S.ipErr ? `<div class="err">${S.ipErr}</div>` : ''}
        <button class="secondary" data-a="ipAdd">Add address</button>
        <div class="sect"><h2>Webhook</h2><span class="pill ${S.hookSaved ? 'ok' : 'warn'}">${S.hookSaved ? 'Configured' : 'Not configured'}</span></div>
        <div class="field"><label for="hook">Endpoint URL</label><input id="hook" value="${S.hookUrl}" placeholder="https://api.yourbusiness.com/hooks"></div>
        <div class="list">${events.map((e) => `<div class="setting" style="background:none;padding:6px 0;border-radius:0"><span class="grow"><span class="t" style="font-family:var(--mono);font-size:12.5px;font-weight:600">${e}</span></span>${toggle('hookEvent', e, !!S.hookEvents[e]).replace('data-a="hookEvent"', 'data-a="hookEvent" data-v="' + e + '"')}</div>`).join('')}</div>
        ${S.hookErr ? `<div class="err">${S.hookErr}</div>` : ''}
        <button class="primary" data-a="hookSave">Save webhook</button>
        <button class="secondary" data-a="testHook"${S.hookSaved ? '' : ' disabled'}>Send test event</button>
        ${S.hookSaved ? '' : '<p class="tiny">Save an endpoint and at least one event before sending a test.</p>'}`;
    }
  };

  const tabDefs = [['home', 'Home', ic.home, ['home', 'track', 'fund']], ['collect', 'Collect', ic.in('currentColor'), ['collect', 'detail', 'customers']], ['pay', 'Pay', ic.out('currentColor'), ['pay']], ['earn', 'Earn', ic.up('currentColor'), ['earn']], ['more', 'More', ic.menu, ['more', 'team', 'cards', 'dev']]];

  const screenEl = document.getElementById('screen');
  const tabsEl = document.getElementById('tabs');
  const toastEl = document.getElementById('toast');
  let toastTimer;
  function flash(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 2800); }

  function render(scrollTop) {
    screenEl.innerHTML = views[S.screen]();
    tabsEl.innerHTML = tabDefs.map((t) => `<button data-a="go" data-v="${t[0]}"${t[3].includes(S.screen) ? ' aria-current="page"' : ''}>${t[2]}${t[1]}</button>`).join('');
    if (scrollTop) screenEl.scrollTop = 0;
  }
  function go(screen) { S.screen = screen; render(true); }

  function gated() {
    if (S.kyb === 'verified') return false;
    flash(S.kyb === 'submitted' ? 'This unlocks once verification is complete.' : 'Verify your business first. Tap "Verify now" on Home.');
    return true;
  }
  const actions = {
    go: (v) => go(v),

    payMode: (v) => { S.payMode = v; render(); },
    recip: (v) => { S.recip = v; render(); },
    sendReview: () => { if (!(S.sendAmt > 0)) { flash('Enter an amount to send.'); return; } if (S.recip === 'new' && !S.newName) { flash('Add the name on the account first.'); return; } S.sendStage = 'review'; render(true); },
    sendEdit: () => { S.sendStage = 'form'; render(); },
    sendConfirm: () => { if (gated()) return; const q = quote(); S.sendStage = q.ngn > 5000000 ? 'approval' : 'sent'; render(true); flash(q.ngn > 5000000 ? 'Sent to Tunde for approval.' : 'Sent. You can track it here and on Home.'); },
    sendApprove: () => { S.sendStage = 'sent'; render(true); flash('Approved and sent.'); },
    sendReceipt: () => flash('Receipt copied: share it with your recipient (demo).'),
    sendAgain: () => { S.sendStage = 'form'; S.recip = 'kwame'; render(true); },
    fundCur: (v) => { S.fundCur = v; render(); },
    fundMethod: (v) => { S.fundMethod = v; render(); },
    fundDone: (v) => {
      if (v !== 'transfer' && gated()) return;
      const a = (document.getElementById('famt') || {}).value;
      flash(v === 'transfer' ? 'Thanks. We\'ll tell you the moment it lands in your ' + S.fundCur + ' wallet.' : v === 'card' ? a + ' added to your ' + S.fundCur + ' wallet (demo).' : a + ' added to your ' + S.fundCur + ' wallet from your ' + document.getElementById('ffrom').value + ' (demo).');
    },
    wallet: () => { S.wallet = (S.wallet + 1) % wallets.length; render(); },
    track: (v) => { S.pay = v; go('track'); },
    detail: (v) => { S.cur = v; go('detail'); },
    copy: (v) => flash(v + ' copied'),
    convert: () => { S.convert[S.cur] = !S.convert[S.cur]; render(); },
    share: () => flash(S.cur + ' account details copied. Paste them into an invoice or email.'),
    activate: () => { if (gated()) return; S.opened[S.cur] = true; render(); flash('Your ' + S.cur + ' account is ready, in the name Kola Exports Ltd.'); },
    upload: () => { S.held = false; render(); flash('Invoice uploaded. We will update you here as soon as it is reviewed.'); },
    submit: () => { S.run = 'pending'; render(); flash('Submitted. Tunde will get a notification to approve.'); },
    approve: () => { if (gated()) return; S.run = 'sent'; render(); flash('Approved. 12 payouts are on their way; track each one on Home.'); },
    resetRun: () => { S.run = 'draft'; render(); },
    earnCur: (v) => { S.earnCur = v; render(); },
    sweep: () => { S.sweep = !S.sweep; render(); flash(S.sweep ? 'Evening sweep is on.' : 'Evening sweep is off. Your balance stays in the wallet.'); },
    wd: (v) => { S.wd = v; render(); },
    withdraw: (v) => gated() || flash(S.wd === 'notice' ? v + ' will be back in your wallet on Wed 28 Oct, free.' : v + ' is back in your wallet now, less the 2% instant fee (' + feeOf(v) + ').'),
    more: (v) => {
      if (v === 'xero') { S.xero = !S.xero; render(); flash(S.xero ? 'Xero connected. Transactions sync every hour.' : 'Xero disconnected.'); }
      else if (v === 'logout') window.OB.start('welcome');
      else if (v === 'statement') flash('October statement ready (demo).');
      else go(v);
    },
    rule: () => { S.rule = !S.rule; render(); },
    match: () => { S.match = !S.match; render(); },
    addCustomer: () => flash('New customer account created. Share its details with your customer.'),
    kyb: () => window.OB.kyb(),
    kybVerify: () => { S.kyb = 'verified'; render(); flash('Business verified. Money movement is unlocked.'); },
    regen: () => { S.regen = true; render(); },
    regenCancel: () => { S.regen = false; render(); },
    regenConfirm: () => { S.key = 'sk_test_' + Array.from({ length: 24 }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join(''); S.regen = false; S.keyShown = true; render(); flash('New key created. The old key no longer works.'); },
    keySaved: () => { S.keyShown = false; render(); },
    ipAdd: () => {
      const ip = document.getElementById('ipnew').value.trim();
      if (!/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}(\/(3[0-2]|[12]?\d))?$/.test(ip)) { S.ipErr = 'Enter an IPv4 address like 102.89.34.18, or a range like 41.58.120.0/24.'; render(); return; }
      S.ipErr = ''; S.ips.push([ip, 'Added just now']); render(); flash(ip + ' added to the allowlist.');
    },
    ipRemove: (v) => { const ip = S.ips[Number(v)][0]; S.ips.splice(Number(v), 1); render(); flash(ip + ' removed.'); },
    hookEvent: (v) => { S.hookUrl = document.getElementById('hook').value.trim(); S.hookEvents[v] = !S.hookEvents[v]; S.hookSaved = false; render(); },
    hookSave: () => {
      const url = document.getElementById('hook').value.trim(); S.hookUrl = url;
      if (!/^https:\/\/[^\s/]+\.[^\s]+/.test(url)) { S.hookErr = 'Enter a full https:// address for your endpoint.'; render(); return; }
      if (!Object.values(S.hookEvents).some(Boolean)) { S.hookErr = 'Choose at least one event.'; render(); return; }
      S.hookErr = ''; S.hookSaved = true; render(); flash('Webhook saved. You can send a test event now.');
    },
    testHook: () => { if (S.hookSaved) flash('Test event sent to ' + S.hookUrl + ' and returned 200 OK (demo).'); }
  };

  document.querySelector('.phone').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-a]');
    if (!b || !actions[b.dataset.a]) return;
    actions[b.dataset.a](b.dataset.v);
  });

  document.addEventListener('input', (e) => {
    const id = e.target.id;
    if (id === 'samt') { S.sendAmt = Number(String(e.target.value).replace(/[^0-9.]/g, '')) || 0; const q = quote(); const g = document.getElementById('sget'); if (g) g.textContent = money(q.r.cur, q.get); const fe = document.getElementById('sfee'); if (fe) fe.textContent = money(S.sendFrom, S.sendAmt * FEE); const to = document.getElementById('stot'); if (to) to.textContent = money(S.sendFrom, S.sendAmt * (1 + FEE)); }
    if (id === 'famt') { const ff = document.getElementById('ffee'); if (ff) ff.textContent = '2% · ' + feeOf(e.target.value); }
    if (id === 'nname') S.newName = e.target.value;
  });
  document.addEventListener('change', (e) => {
    const id = e.target.id;
    if (id === 'sfrom') { S.sendFrom = e.target.value; render(); }
    if (id === 'ncountry') { S.newCur = e.target.value; S.newType = ''; render(); }
    if (id === 'ntype') S.newType = e.target.value;
  });
  window.obKyb = (status) => { S.kyb = status; };
  window.obHostShow = (app) => { document.getElementById('ob').hidden = app; screenEl.hidden = !app; tabsEl.hidden = !app; toastEl.hidden = true; if (app) { S.screen = 'home'; render(true); } };
  render(true);
  window.OB.start('welcome');
})();
</script>

</body>
</html>
