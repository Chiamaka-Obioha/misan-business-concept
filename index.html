<style>
/* Layout: one phone-sized app, full screen on phones, centred in a frame on wider screens. Single committed light look. */
:root {

}
html, body { height: 100%; }

}
@media (max-width: 599px), (max-height: 759px) { .caption { display: none; } }
.banner { flex-shrink: 0; background: var(--ink); color: var(--lime); font-size: 11px; font-weight: 600; text-align: center; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.screen { flex: 1; overflow-y: auto; padding-block: 18px 24px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }

.back { width: 44px; height: 44px; margin: -8px 0 -6px -10px; border: none; background: none; display: flex; align-items: center; justify-content: center; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

.pill.biz { background: var(--lilac); color: var(--violet-deep); font-size: 12px; font-weight: 600; padding: 6px 12px; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }

<body>

<div class="stage">
  <p class="caption">Clickable concept by Chiamaka Obioha for Misan Business. Not an official Misan product; all figures are samples.</p>
  <div class="phone">
    <div class="banner">Concept by Chiamaka Obioha · not an official Misan product</div>
    <div class="ob" id="ob" hidden></div>
    <main class="screen" id="screen" aria-live="polite"></main>
    <div class="toast" id="toast" role="status" hidden></div>
    <nav class="tabs" id="tabs" aria-label="Main"></nav>
  </div>
</div>

<script>


/* Onboarding module. Renders into #ob.
   Host provides: window.obHostShow(showApp), window.obKyb(status), window.obMode(mode, acct).
   mode: 'fresh' (new business, empty) or 'demo' (established, sample data). */
(function () {
  const el = document.getElementById('ob');

  function render() { el.innerHTML = `<div class="ob-wrap"><div class="ob-card">${V[O.view]()}</div></div>`; el.scrollTop = 0; window.scrollTo(0, 0); }
  function to(v) { O.view = v; O.err = ''; O.note = ''; render(); }
  function fail(m) { O.err = m; render(); }
  function enterApp() { const c = cur(); window.obMode(c.mode, Object.assign({ key: O.who }, c.acct)); window.obKyb(c.kyb); window.obHostShow(true); }
  function resetKyb() { Object.assign(O, { step: 0, entity: 'ltd', looked: false, industry: 'Import and export', selfie: false, invited: {}, signers: { me: true }, pep: 'no', nominee: 'no', docs: {}, consent: false, consent2: false }); }
  function validate() {

  function kybCard() {
    if (S.kyb === 'verified') return '';
    if (S.kyb === 'submitted') return `<div class="kybm info"><b>Verification in progress.</b> Usually within 1 business day.<span class="ob-row" style="margin-top:8px"><button class="chip-btn" data-a="kyb">View status</button><button class="chip-btn ghost" data-a="kybVerify">Mark verified (demo)</button></span></div>`;
    return `<div class="kybm warn"><b>Verify ${esc(biz())} to start moving money.</b> Collect, Pay, Earn and loans unlock once verified. About 10 minutes.<span class="ob-row" style="margin-top:8px"><button class="chip-btn" data-a="kyb">Verify now</button></span></div>`;
  }

  const views = {
    fund() {
      const f = fundInfo[S.fundCur];
      const methods = [['transfer', 'Bank transfer', '2% fee'], ['card', 'Debit card', '2% fee · instant'], ['convert', 'Convert', 'From another wallet'], ['earn', 'From Earn', 'Free next day']]
        .map((m) => `<button class="opt" data-a="fundMethod" data-v="${m[0]}" aria-pressed="${S.fundMethod === m[0]}"><span class="t">${m[1]}</span><span class="small">${m[2]}</span></button>`).join('');
      const amt = (label) => `<div class="field"><label for="famt">${label}</label><input id="famt" inputmode="decimal" value="${f.def}"></div><div class="list"><div class="kv"><span class="k">Fee (2%)</span><span class="v num" id="ffee">${money(S.fundCur, f.def * FEE)}</span></div><div class="kv"><span class="k">You'll receive</span><span class="v num" id="fnet">${money(S.fundCur, f.def * (1 - FEE))}</span></div></div>`;
      let body = '';
      if (S.fundMethod === 'transfer') body = `<p class="lede" style="font-size:13px">Send money to these details from ${f.via}. It lands in your ${S.fundCur} wallet. ${f.when}.</p>
        <div class="list"><div class="kv"><span class="k">Account name</span><span class="v">${esc(biz()).toUpperCase()}${S.fundCur === 'NGN' ? ' - MISAN' : ''}</span></div>${f.lines.map((l) => `<div class="kv"><span class="k">${l[0]}</span><span class="v num">${l[1]}<button class="copy" data-a="copy" data-v="${l[0]}" aria-label="Copy ${l[0]}">${ic.copy}</button></span></div>`).join('')}</div>
        ${amt('Amount you sent (' + S.fundCur + ')')}
        <p class="tiny">Sample details. In this demo, "I've sent the money" credits the wallet straight away.</p>
        ${err()}<button class="primary" data-a="fundDone" data-v="transfer">I've sent the money</button>`;
      if (S.fundMethod === 'card') body = `${amt('Amount (' + S.fundCur + ')')}${err()}<button class="primary" data-a="fundDone" data-v="card">Pay with card</button>`;
      if (S.fundMethod === 'convert') body = `<div class="field"><label for="ffrom">From</label><select id="ffrom">${WALLETS.filter((c) => c !== S.fundCur).map((c) => `<option value="${c}">${c} wallet · ${money(c, D.bal[c])}</option>`).join('')}</select></div>
        ${amt('Amount to add (' + S.fundCur + ')')}<div class="list"><div class="kv"><span class="k">Rate locked for</span><span class="v">30 seconds</span></div></div>
        ${err()}<button class="primary" data-a="fundDone" data-v="convert">Convert</button>`;
      if (S.fundMethod === 'earn') body = `<p class="lede" style="font-size:13px">Move money back from Earn into your ${S.fundCur} wallet. It's free with one business day's notice, or instant for a 2% fee.</p><button class="primary" data-a="go" data-v="earn">Go to Earn</button>`;
      return `${back()}<h1>FUND WALLET</h1>
        <div class="seg" role="group" aria-label="Wallet" style="grid-template-columns:repeat(3,1fr)">${['NGN', 'USD', 'GBP'].map((c) => `<button data-a="fundCur" data-v="${c}" aria-pressed="${S.fundCur === c}">${c}</button>`).join('')}</div>
        <p class="small" style="margin:0">${S.fundCur} wallet: ${money(S.fundCur, D.bal[S.fundCur])} available</p>
        <div class="methods">${methods}</div>${body}`;
    },
    home() {
      const c = WALLETS[S.wallet];
      const rows = D.tx.slice(0, 4).map(txRow).join('');
      const nothing = D.tx.length === 0;
      return `${kybCard()}
        <div class="top"><span class="who"><span class="avatar">${initials(biz())}</span>${esc(biz()).toUpperCase()}</span><span class="pill biz">Business</span></div>
        <section class="hero">
          <button class="chip" data-a="wallet">${c} wallet ▾</button>
          <span class="big num">${money(c, D.bal[c])}</span>

            <button class="act" data-a="go" data-v="collect"><span>${ic.in('#D9FF1F')}</span>Collect</button>

          : S.kyb === 'verified' && nothing ? `<button class="promo" data-a="go" data-v="fund"><b>YOU'RE <em>VERIFIED</em></b><span>Fund your wallet or share your collection account details to receive your first payment.</span><i>Fund wallet →</i></button>` : ''}
        <div class="sect"><h2>Recent activity</h2>${D.tx.length > 4 ? '<button class="link" data-a="go" data-v="activity" style="background:none;border:0;font:inherit">See all</button>' : ''}</div>

    activity() { return `${back()}<h1>ACTIVITY</h1><div class="list">${D.tx.map(txRow).join('')}</div>`; },

        ${WALLETS.includes(d.code) ? `<div class="simbox"><b>Test a collection (demo)</b><div class="field"><label for="cpayer">Customer</label><input id="cpayer" placeholder="e.g. Brightway Foods Ltd"></div><div class="field"><label for="camt">Amount (${d.code})</label><input id="camt" inputmode="decimal" placeholder="e.g. 1000"></div>${err()}<button class="secondary" data-a="simCollect">Simulate incoming payment</button></div>` : ''}`;
    },
    track() {
      const p = D.tx.find((t) => t.id === S.pay) || D.tx[0];
      const steps = (p.steps || []).map((s) => `<div class="step"><span class="rail"><span class="dot d-${s[2]}"></span><span class="line"></span></span><span class="grow"><span class="t" style="font-weight:600${s[2] === 'hold' ? ';color:var(--warn)' : s[2] === 'todo' ? ';color:var(--muted)' : ''}">${esc(s[0])}</span><span class="small">${s[1]}</span></span></div>`).join('');
      return `${back()}<div class="center"><span style="font-weight:700;color:var(--ink)">${esc(p.what)}</span><span class="big num">${p.amt}</span><span class="small">${p.kind === 'in' ? 'From ' : p.kind === 'out' ? 'To ' : ''}${esc(p.who)}</span><span style="font-weight:700;color:${toneColor[p.tone]}">${p.st}</span></div>
        ${steps ? `<div class="steps"><p>Where your money is</p>${steps}</div>` : ''}
        ${p.hold ? `<div class="hold"><p><b>We need one thing from you</b></p><p>Upload the invoice for this payment and we'll release it. Most holds clear within 2 hours of upload.</p><button class="primary" data-a="upload">Upload invoice</button></div>` : ''}
        <p class="tiny">${p.into ? 'Paid into ' + p.into + '. ' : ''}${p.when}. You'll get a push notification, an email and a webhook at each step.</p>`;
    },
    pay() {
      const seg = `<div class="seg" role="group" aria-label="Payment type"><button data-a="payMode" data-v="single" aria-pressed="${S.payMode === 'single'}">Send money</button><button data-a="payMode" data-v="bulk" aria-pressed="${S.payMode === 'bulk'}">Bulk payouts</button></div>`;
      if (S.payMode === 'single') return `<h1>PAY</h1>${seg}` + sendForm();
      const runs = D.runs.length ? `<div class="list">${D.runs.map((r) => `<div class="row"><span class="grow"><span class="t">${esc(r[0])}</span><span class="small">${r[1]}</span></span><span class="end num">${r[2]}</span></div>`).join('')}</div>` : '<p class="small" style="margin:0">No scheduled runs yet. Payroll and supplier runs you schedule show here.</p>';
      if (!D.bulk) return `<h1>PAY</h1>${seg}${empty('No payout runs yet', 'Upload a CSV of payees to pay many people at once. You\'ll check every row before anything is sent.', '<button class="chip-btn" data-a="newRun">Upload CSV</button>')}<div class="sect" style="padding-top:6px"><h2>Scheduled runs</h2></div>${runs}`;
      const b = D.bulk, st = { draft: ['Draft', 'grey'], pending: ['Awaiting approval', 'warn'], sent: ['Sent', 'ok'] }[b.status];
      const payees = b.payees.map((y) => `<div class="r"><span style="display:flex;flex-direction:column;gap:2px;min-width:0"><span class="t" style="font-weight:600">${esc(y[0])}</span><span class="small">${y[1]}</span></span><span class="num" style="font-weight:700;flex-shrink:0">${y[2]}</span></div>`).join('');
      const total = bulkTotal();
      const two = total > 5000000 && S.rule && D.team.length > 1;
      const cta = b.status === 'draft' ? (two ? `<button class="primary" data-a="submit">Submit for approval</button>` : `<button class="primary" data-a="approve">Approve and send</button>`)
        : b.status === 'pending' ? `<p class="lede" style="font-size:13px">Runs over ₦5,000,000 need a second approver.</p><button class="primary" data-a="approve">Approve as second approver (demo)</button>`
        : `<button class="secondary" data-a="newRun">Start a new run</button>`;
      return `<h1>PAY</h1>${seg}
        <div class="batch"><div class="head"><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:700">${esc(b.name)}</span><span class="small">${b.file} · ${b.payees.length + (b.more || 0)} payees</span></span><span class="pill ${st[1]}">${st[0]}</span></div>${payees}
        ${b.more ? `<div class="r"><span class="small">+ ${b.more} more payees · rates locked for 30 minutes once approved</span></div>` : ''}
        <div class="r"><span class="small">Total ${money('NGN', total)} + 2% fee ${money('NGN', total * FEE)} · from NGN wallet (${money('NGN', D.bal.NGN)})</span></div></div>
        ${err()}${cta}
        <div class="sect" style="padding-top:6px"><h2>Scheduled runs</h2></div>${runs}`;

    earn() {

        <div class="setting"><span class="grow"><span class="t">Evening sweep</span><span class="small">Keep ${money(c, S.floor[c])} in the wallet (${money(c, D.bal[c])} now), move the rest into Earn</span></span>${toggle('sweep', 'Evening sweep', S.sweep)}</div>

        ${err()}<button class="primary" data-a="withdraw">Withdraw</button>
        ${D.onNotice[c] ? `<div class="row" style="border-top:1px solid var(--line)"><span class="grow"><span class="t">On notice for payroll</span><span class="small">Back on 24 Nov, before the 25 Nov run</span></span><span class="end num">${money(c, D.onNotice[c])}</span></div>` : ''}

        ? `<div class="hold"><p><b>Regenerate the test key?</b></p><p>The current key stops working immediately. Apps using it will fail until you update them.</p><button class="primary" data-a="regenConfirm">Regenerate now</button><button class="secondary" data-a="regenCancel">Cancel</button></div>`
        : S.keyShown
          ? `<div class="card"><span class="small" style="font-weight:600">New test key. Copy it now; we won't show it again.</span><div class="keybox">${D.key}</div><button class="primary" data-a="keySaved">I've saved it</button></div>`
          : `<div class="card"><span class="small" style="font-weight:600">Test API key</span><span style="font-family:var(--mono);font-size:13px">${masked}</span></div><button class="secondary" data-a="regen">Regenerate key</button>`;
      const ips = D.ips.map((ip, i) => `<div class="row" style="min-height:56px"><span class="grow"><span class="t" style="font-family:var(--mono);font-size:13px">${ip[0]}</span><span class="small">${ip[1]}</span></span><button class="copy" style="width:auto;padding:0 8px;color:var(--violet);font-weight:600" data-a="ipRemove" data-v="${i}" aria-label="Remove ${ip[0]}">Remove</button></div>`).join('');
      return `${back()}<h1>DEVELOPERS</h1><p class="lede">Collect, pay and track from your own systems.</p>
        ${keyBlock}
        <div class="sect"><h2>IP allowlist</h2></div>
        ${ips ? `<div class="list">${ips}</div>` : '<p class="small" style="margin:0">No addresses yet. Calls are accepted from anywhere until you add one.</p>'}
        <div class="field"><label for="ipnew">Add an IP address or range</label><input id="ipnew" placeholder="e.g. 102.89.34.18" style="font-family:var(--mono)"></div>
        ${S.ipErr ? `<div class="err">${S.ipErr}</div>` : ''}
        <button class="secondary" data-a="ipAdd">Add address</button>
        <div class="sect"><h2>Webhook</h2><span class="pill ${D.hookSaved ? 'ok' : 'warn'}">${D.hookSaved ? 'Configured' : 'Not configured'}</span></div>
        <div class="field"><label for="hook">Endpoint URL</label><input id="hook" value="${esc(D.hookUrl)}" placeholder="https://api.yourbusiness.com/hooks"></div>
        <div class="list">${events.map((e) => `<div class="setting" style="background:none;padding:6px 0;border-radius:0"><span class="grow"><span class="t" style="font-family:var(--mono);font-size:12.5px;font-weight:600">${e}</span></span>${toggle('hookEvent', e, !!D.hookEvents[e], e)}</div>`).join('')}</div>
        ${S.hookErr ? `<div class="err">${S.hookErr}</div>` : ''}
        <button class="primary" data-a="hookSave">Save webhook</button>
        <button class="secondary" data-a="testHook"${D.hookSaved ? '' : ' disabled'}>Send test event</button>
        ${D.hookSaved ? '' : '<p class="tiny">Save an endpoint and at least one event before sending a test.</p>'}`;
    }
  };

  const tabDefs = [['home', 'Home', ic.home, ['home', 'track', 'fund', 'activity']], ['collect', 'Collect', ic.in('currentColor'), ['collect', 'detail', 'customers']], ['pay', 'Pay', ic.out('currentColor'), ['pay']], ['earn', 'Earn', ic.up('currentColor'), ['earn']], ['more', 'More', ic.menu, ['more', 'team', 'cards', 'dev']]];
  const screenEl = document.getElementById('screen'), tabsEl = document.getElementById('tabs'), toastEl = document.getElementById('toast');
  let toastTimer;
  function flash(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 3000); }
  function render(scrollTop) {
    screenEl.innerHTML = views[S.screen]();
    tabsEl.innerHTML = tabDefs.map((t) => `<button data-a="go" data-v="${t[0]}"${t[3].includes(S.screen) ? ' aria-current="page"' : ''}>${t[2]}${t[1]}</button>`).join('');
    if (scrollTop) screenEl.scrollTop = 0;
  }
  function go(screen) { S.screen = screen; S.err = ''; render(true); }
  const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  function bad(m) { S.err = m; render(); }
  function gated() {
    if (S.kyb === 'verified') return false;
    flash(S.kyb === 'submitted' ? 'This unlocks once verification is complete. In the demo, tap "Mark verified" on Home.' : 'Verify your business first. Tap "Verify now" on Home.');
    return true;
  }

  const actions = {
    go: (v) => go(v),
    payMode: (v) => { S.payMode = v; S.err = ''; render(); },
    recip: (v) => { S.recip = v; S.err = ''; render(); },
    sendReview: () => {
      if (S.recip === 'new' && (!S.newName || !S.newAcct)) return bad('Add the name and account or phone number of the person you\'re paying.');
      if (!(S.sendAmt > 0)) return bad('Enter an amount to send.');
      if (S.sendAmt * (1 + FEE) > D.bal[S.sendFrom]) return bad('Not enough in your ' + S.sendFrom + ' wallet. You need ' + money(S.sendFrom, S.sendAmt * (1 + FEE)) + ' including the fee. Fund your wallet first.');
      S.err = ''; S.sendStage = 'review'; render(true);
    },
    sendEdit: () => { S.sendStage = 'form'; render(); },
    sendConfirm: () => {
      if (gated()) return;
      const q = quote(), needs = needsApproval(q);
      D.bal[S.sendFrom] -= S.sendAmt * (1 + FEE);
      if (S.recip === 'new') { const id = 'r' + Date.now(); D.recips.push({ id, name: q.r.name, where: q.r.where, cur: q.r.cur, eta: q.r.eta, place: q.r.place }); S.recip = id; S.newName = ''; S.newAcct = ''; }
      const r = recipient();
      S.last = { name: r.name, place: r.place, eta: r.eta, from: S.sendFrom, got: money(r.cur, q.get) };
      S.last.tx = addTx(r.name, 'Payout · ' + r.cur, '−' + money(r.cur, q.get), 'out', needs ? 'Pending approval' : 'Delivered', needs ? 'warn' : 'ok',
        [['Left your ' + S.sendFrom + ' wallet (fee ' + money(S.sendFrom, S.sendAmt * FEE) + ')', 'Just now', 'done'], ['With our partner in ' + r.place, needs ? 'After approval' : 'Just now', needs ? 'todo' : 'done'], ['Delivered to ' + r.name, r.eta, needs ? 'todo' : 'now']]);
      S.sendStage = needs ? 'approval' : 'sent'; render(true); flash(needs ? 'Sent for approval. The money is reserved.' : 'Sent. You can track it on Home.');
    },
    sendApprove: () => { const t = S.last.tx; t.st = 'Delivered'; t.tone = 'ok'; t.steps.forEach((s, i) => { s[2] = i === 2 ? 'now' : 'done'; }); S.sendStage = 'sent'; render(true); flash('Approved and sent.'); },
    sendReceipt: () => flash('Receipt copied: share it with your recipient (demo).'),
    sendAgain: () => { S.sendStage = 'form'; S.sendAmt = 0; render(true); },
    fundCur: (v) => { S.fundCur = v; S.err = ''; render(); },
    fundMethod: (v) => { S.fundMethod = v; S.err = ''; render(); },
    fundDone: (v) => {
      if (gated()) return;
      const c = S.fundCur, amt = num(val('famt')), net = amt * (1 - FEE);
      if (!(amt > 0)) return bad('Enter an amount to add.');
      if (v === 'convert') {
        const from = val('ffrom'), cost = amt * rate[c] / rate[from];
        if (cost > D.bal[from]) return bad('Not enough in your ' + from + ' wallet. You need ' + money(from, cost) + '.');
        D.bal[from] -= cost;
      }
      D.bal[c] += net;
      addTx(v === 'convert' ? 'Conversion from ' + val('ffrom') : v === 'card' ? 'Card top-up' : 'Bank transfer', 'Funding · ' + c, '+' + money(c, net), 'fund', 'Credited', 'ok', [['Received ' + money(c, amt), 'Just now', 'done'], ['2% fee: ' + money(c, amt * FEE), 'Just now', 'done'], ['Credited to ' + c + ' wallet', 'Just now', 'done']]);
      S.err = ''; S.wallet = WALLETS.indexOf(c); render(); flash(money(c, net) + ' added to your ' + c + ' wallet after the 2% fee.');
    },
    wallet: () => { S.wallet = (S.wallet + 1) % WALLETS.length; render(); },
    track: (v) => { S.pay = v; go('track'); },
    detail: (v) => { S.cur = v; go('detail'); },
    copy: (v) => flash(v + ' copied'),
    convert: () => { D.convert[S.cur] = !D.convert[S.cur]; render(); },
    share: () => flash(S.cur + ' account details copied. Paste them into an invoice or email.'),
    activate: () => { if (gated()) return; D.opened[S.cur] = true; render(); flash('Your ' + S.cur + ' account is ready, in the name ' + biz() + '.'); },
    simCollect: () => {
      if (gated()) return;
      const c = S.cur, who = val('cpayer') || 'A customer', amt = num(val('camt'));
      if (!(amt > 0)) return bad('Enter the amount the customer paid.');
      D.bal[c] += amt;
      const cust = D.customers.find((x) => x[1].toLowerCase() === who.toLowerCase() && x[2] === c); if (cust) cust[4] += amt;
      addTx(who, 'Collection · ' + c, '+' + money(c, amt), 'in', 'Credited', 'ok', [['Received on your ' + c + ' account', 'Just now', 'done'], ['Screening passed', 'Just now', 'done'], ['Credited to ' + c + ' wallet', 'Just now', 'done']], { into: 'your ' + c + ' account' });
      S.err = ''; S.wallet = WALLETS.indexOf(c); render(); flash(money(c, amt) + ' from ' + who + ' credited to your ' + c + ' wallet.');
    },
    upload: () => { D.held = false; D.bal.USD += 2950; const t = D.tx.find((x) => x.id === 'p2'); if (t) { t.hold = false; t.st = 'Credited'; t.tone = 'ok'; t.steps = [['Received by US partner bank', '08:02', 'done'], ['Invoice received', 'Just now', 'done'], ['Credited to USD wallet', 'Just now', 'done']]; } render(); flash('Invoice uploaded. $2,950.00 released to your USD wallet.'); },
    newRun: () => {
      if (gated()) return;
      D.bulk = { name: 'Supplier run · 28 Oct', file: 'payees.csv', status: 'draft', payees: [['Kwame Mensah', 'Ghana · MTN Mobile Money', 'GHS 1,500', Math.round(1500 * rate.GHS)], ['Wanjiru Kamau', 'Kenya · M-Pesa', 'KES 20,000', Math.round(20000 * rate.KES)], ['Bello Logistics Ltd', 'Nigeria · bank transfer', '₦150,000', 150000], ['Thames Freight Ltd', 'United Kingdom · Faster Payments', '£200', Math.round(200 * rate.GBP)]], more: 0, moreNgn: 0 };
      S.err = ''; render(); flash('payees.csv uploaded: 4 payees checked, 0 errors.');
    },
    submit: () => { D.bulk.status = 'pending'; render(); flash('Submitted for approval.'); },
    approve: () => {
      if (gated()) return;
      const t = bulkTotal() * (1 + FEE);
      if (t > D.bal.NGN) return bad('Not enough in your NGN wallet. This run needs ' + money('NGN', t) + ' including the 2% fee.');
      D.bal.NGN -= t; D.bulk.status = 'sent'; S.err = '';
      addTx(D.bulk.name, 'Payout run · ' + (D.bulk.payees.length + (D.bulk.more || 0)) + ' payees', '−' + money('NGN', bulkTotal()), 'out', 'Paid', 'ok', [['Approved', 'Just now', 'done'], ['Fee: ' + money('NGN', bulkTotal() * FEE), 'Just now', 'done'], ['Payouts delivered', 'Within minutes', 'now']]);
      render(); flash('Approved. The payouts are on their way; track the run on Home.');
    },
    earnCur: (v) => { S.earnCur = v; S.err = ''; render(); },
    sweep: () => { S.sweep = !S.sweep; render(); flash(S.sweep ? 'Evening sweep is on.' : 'Evening sweep is off. Your balance stays in the wallet.'); },
    sweepNow: () => {
      if (gated()) return;
      const c = S.earnCur; S.floor[c] = num(val('floor'));
      if (!S.sweep) return bad('Turn the evening sweep on first.');
      const amt = D.bal[c] - S.floor[c];
      if (amt <= 0) return bad('Nothing to sweep. Your ' + c + ' wallet is at or below the floor of ' + money(c, S.floor[c]) + '.');
      D.bal[c] -= amt; D.earn[c] += amt; S.err = '';
      addTx('Evening sweep', 'Earn · ' + c, money(c, amt), 'earn', 'Swept', 'grey', [['Moved from ' + c + ' wallet', 'Just now', 'done'], ['Invested in ' + (c === 'NGN' ? 'naira Treasury Bills' : 'dollar fixed income'), 'Just now', 'done']]);
      render(); flash(money(c, amt) + ' moved into Earn.');
    },
    wd: (v) => { S.wd = v; render(); },
    withdraw: () => {
      if (gated()) return;
      const c = S.earnCur, amt = num(val('wamt'));
      if (!(amt > 0)) return bad('Enter an amount to withdraw.');
      if (amt > D.earn[c]) return bad('You have ' + money(c, D.earn[c]) + ' in Earn.');
      const fee = S.wd === 'instant' ? amt * FEE : 0;
      D.earn[c] -= amt; D.bal[c] += amt - fee; S.err = '';
      addTx(S.wd === 'instant' ? 'Instant withdrawal' : 'Notice withdrawal', 'Earn · ' + c, '+' + money(c, amt - fee), 'earn', 'Back in wallet', 'ok', [['Withdrawn from Earn', 'Just now', 'done'], [fee ? 'Instant fee (2%): ' + money(c, fee) : 'No fee', 'Just now', 'done'], ['Back in ' + c + ' wallet', 'Just now', 'done']]);
      render(); flash(S.wd === 'instant' ? money(c, amt - fee) + ' is back in your wallet after the 2% fee.' : money(c, amt) + ' is back in your wallet (in this demo, notice withdrawals settle straight away).');
    },
    more: (v) => {
      if (v === 'xero') { S.xero = !S.xero; render(); flash(S.xero ? 'Xero connected. Transactions sync every hour.' : 'Xero disconnected.'); }
      else if (v === 'logout') window.OB.start('welcome');
      else if (v === 'statement') flash(D.tx.length ? 'October statement ready (demo).' : 'No transactions to put on a statement yet.');
      else go(v);
    },
    rule: () => { S.rule = !S.rule; render(); },
    match: () => { S.match = !S.match; render(); },
    invite: () => {
      const n = val('iname'), em = val('iemail'), role = val('irole');
      if (!n || !/^\S+@\S+\.\S+$/.test(em)) return bad('Add their full name and a valid work email.');
      D.team.push([initials(n), n, role + ' · invited', role === 'Viewer' ? 'Read only' : role === 'Preparer' ? 'Prepares only' : '₦20,000,000 a day']);
      S.err = ''; render(); flash('Invite sent to ' + em + '.');
    },
    issueCard: () => {
      if (gated()) return;
      const n = val('cname'), lim = num(val('clim'));
      if (!n || !(lim > 0)) return bad('Add a card name and a monthly limit.');
      const last = digits(4); D.cards.unshift([n + ' · ' + S.acct.first, last, 0, lim, 'new card']); S.err = ''; render(); flash('Card ending ' + last + ' issued.');
    },
    addCustomer: () => { const n = val('custname'), c = val('custcur'); if (!n) return bad('Add the customer\'s name.'); D.customers.unshift([initials(n), n, c, c + ' account ending ' + digits(4), 0]); S.err = ''; render(); flash('Customer account created for ' + n + '. Share its details with them.'); },
    kyb: () => window.OB.kyb(),
    kybVerify: () => { S.kyb = 'verified'; window.OB.setKyb('verified'); render(); flash(biz() + ' is verified. Money movement is unlocked.'); },
    regen: () => { S.regen = true; render(); },
    regenCancel: () => { S.regen = false; render(); },
    regenConfirm: () => { D.key = 'sk_test_' + rnd(24); S.regen = false; S.keyShown = true; render(); flash('New key created. The old key no longer works.'); },
    keySaved: () => { S.keyShown = false; render(); },
    ipAdd: () => {
      const ip = val('ipnew');
      if (!/^(25[0-5]|2[0-4]\d|1?\d?\d)(\.(25[0-5]|2[0-4]\d|1?\d?\d)){3}(\/(3[0-2]|[12]?\d))?$/.test(ip)) { S.ipErr = 'Enter an IPv4 address like 102.89.34.18, or a range like 41.58.120.0/24.'; render(); return; }
      if (D.ips.some((x) => x[0] === ip)) { S.ipErr = ip + ' is already on the list.'; render(); return; }
      S.ipErr = ''; D.ips.push([ip, 'Added just now']); render(); flash(ip + ' added to the allowlist.');
    },
    ipRemove: (v) => { const ip = D.ips[Number(v)][0]; D.ips.splice(Number(v), 1); render(); flash(ip + ' removed.'); },
    hookEvent: (v) => { D.hookUrl = val('hook'); D.hookEvents[v] = !D.hookEvents[v]; D.hookSaved = false; render(); },
    hookSave: () => {
      const url = val('hook'); D.hookUrl = url;
      if (!/^https:\/\/[^\s/]+\.[^\s]+/.test(url)) { S.hookErr = 'Enter a full https:// address for your endpoint.'; render(); return; }
      if (!Object.values(D.hookEvents).some(Boolean)) { S.hookErr = 'Choose at least one event.'; render(); return; }
      S.hookErr = ''; D.hookSaved = true; render(); flash('Webhook saved. You can send a test event now.');
    },
    testHook: () => { if (D.hookSaved) flash('Test event sent to ' + D.hookUrl + ' and returned 200 OK (demo).'); }
  };

  document.querySelector('.phone').addEventListener('click', (ev) => {
    if (ev.target.closest('#ob')) return;
    const b = ev.target.closest('[data-a]');
    if (!b || !actions[b.dataset.a] || b.disabled) return;
    actions[b.dataset.a](b.dataset.v);
  });
  document.addEventListener('input', (e) => {
    if (e.target.closest('#ob')) return;
    const id = e.target.id, set = (i, v) => { const n = document.getElementById(i); if (n) n.textContent = v; };
    if (id === 'samt') { S.sendAmt = num(e.target.value); const q = quote(); set('sget', money(q.r.cur, q.get)); set('sfee', money(S.sendFrom, S.sendAmt * FEE)); set('stot', money(S.sendFrom, S.sendAmt * (1 + FEE))); }
    if (id === 'famt') { const a = num(e.target.value); set('ffee', money(S.fundCur, a * FEE)); set('fnet', money(S.fundCur, a * (1 - FEE))); }
    if (id === 'nname') S.newName = e.target.value.trim();
    if (id === 'nacct') S.newAcct = e.target.value.trim();
  });
  document.addEventListener('change', (e) => {
    if (e.target.closest('#ob')) return;
    const id = e.target.id;
    if (id === 'sfrom') { S.sendFrom = e.target.value; render(); }
    if (id === 'ncountry') { S.newCur = e.target.value; S.newType = ''; render(); }
    if (id === 'ntype') S.newType = e.target.value;
  });

  window.obMode = (mode, acct) => {
    const key = acct.key === 'signup' ? 'signup:' + acct.email : acct.key;
    if (!DATA[key]) DATA[key] = mode === 'demo' ? demoData() : freshData(acct);
    D = DATA[key]; S.acct = acct; S.screen = 'home'; S.wallet = 0; S.payMode = 'single'; S.sendStage = 'form'; S.sendAmt = 0; S.recip = D.recips.length ? D.recips[0].id : 'new'; S.err = ''; S.regen = false; S.keyShown = false; S.ipErr = ''; S.hookErr = '';
  };
  window.obKyb = (status) => { S.kyb = status; };
  window.obHostShow = (app) => { document.getElementById('ob').hidden = app; screenEl.hidden = !app; tabsEl.hidden = !app; toastEl.hidden = true; if (app) render(true); };
  render(true);
  window.OB.start('welcome');
})();
</script>

</body>
</html>
